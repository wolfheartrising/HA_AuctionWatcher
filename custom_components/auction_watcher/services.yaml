set_bid_limit:
  fields:
    auction_id:
      required: true
      example: "17782125"
      selector:
        text:
    limit:
      required: true
      example: 1000
      selector:
        number:
          min: 0
          max: 100000
          mode: box
          unit_of_measurement: bids

refresh:
  fields:
    site:
      example: govauctions
      selector:
        select:
          options:
            - govauctions
            - macbid

book_bids:
  fields:
    auction_id:
      required: true
      example: "17782125"
      selector:
        text:
    count:
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 10000
          mode: box
          unit_of_measurement: bids
    max_price:
      example: 95
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
          unit_of_measurement: "$"

cancel_booked_bids:
  fields:
    auction_id:
      required: true
      example: "17782125"
      selector:
        text:

set_auto_booking:
  fields:
    auction_id:
      required: true
      example: "17782125"
      selector:
        text:
    auto_cancel:
      selector:
        boolean:
    auto_rebook:
      selector:
        boolean:
    rebook_mode:
      selector:
        select:
          options:
            - fixed
            - remaining
    rebook_amount:
      selector:
        number:
          min: 1
          max: 10000
          mode: box
          unit_of_measurement: bids
    max_price:
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
          unit_of_measurement: "$"

place_bid:
  fields:
    auction_id:
      required: true
      example: "67465504"
      selector:
        text:
    amount:
      required: true
      example: 40
      selector:
        number:
          min: 1
          max: 100000
          mode: box
          unit_of_measurement: "$"

set_macbid_bidding:
  fields:
    auction_id:
      required: true
      example: "67465504"
      selector:
        text:
    mode:
      selector:
        select:
          options:
            - "off"
            - now
            - late
    late_seconds:
      example: 180
      selector:
        number:
          min: 30
          max: 3600
          mode: box
          unit_of_measurement: s
